      - scipy==1.11.4
      - pandas==2.1.4
      - pyyaml==6.0.1
      - matplotlib==3.8.2
      - requests==2.31.0
      - spacy==3.7.2
      - colbert-ai==0.2.19
      - pytest==7.4.3

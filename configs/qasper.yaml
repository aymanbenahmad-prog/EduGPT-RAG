# EduGPT-RAG on QASPER v0.3 (future-work protocol, same settings as SQuAD 2.0)
dataset: qasper
seeds: [42, 123, 456]
corpus_dir: data/processed/qasper
index_dir: indexes/qasper
output_dir: results/raw
max_eval_examples: null        # null = all 1,005 QASPER development questions
device: cuda
chunking:
  window: 512                  # w (whitespace-delimited tokens)
  overlap: 128                 # s
retrieval:
  sbert_model: sentence-transformers/all-mpnet-base-v2
  embedding_dim: 768
  k_dense: 20                  # k_d
  k_sparse: 20                 # k_s
  rrf_kappa: 60
  n_fused: 20                  # n
  faiss_nlist: 4096            # IVF4096
  faiss_pq_m: 64               # PQ64
  faiss_nprobe: 128
  faiss_train_sample: 100000   # up to 100K vectors (see data/processed/qasper/corpus_stats.json)
  bm25_k1: 1.2
  bm25_b: 0.75
  bm25_backend: pyserini
reranker:
  base_model: cross-encoder/ms-marco-MiniLM-L-12-v2
  checkpoint: checkpoints/reranker_seed{seed}   # produced by training/train_reranker_msmarco.py
  top_k: 5                     # K
  max_length: 512
generator:
  model: gpt-3.5-turbo
  temperature: 0.1
  max_tokens: 512
verifier:
  nli_model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
  tau: 0.75
  hallucination_threshold: 0.50
  citation_threshold: 0.75
  max_length: 512
use_dense: true
use_sparse: true
use_rerank: true
use_cot: true
use_verification: true
